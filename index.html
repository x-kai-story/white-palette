<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>A6製本レイアウト（A4横印刷用）</title>
    <!-- html2canvasとjsPDFを読み込んでダウンロード機能を実装 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #e0e0e0; display: flex; flex-direction: column; align-items: center; }
        .controls { margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; }
        .page { width: 297mm; height: 210mm; background: white; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(0,0,0,0.3); }
        .cut-container { border: 1px dotted #666; padding: 20px; display: flex; align-items: flex-start; box-sizing: border-box; }
        .img-item { width: 105mm; height: 148.5mm; object-fit: contain; }
        .spine-space { width: 10mm; height: 148.5mm; background-color: #f9f9f9; border-left: 1px dotted #ccc; border-right: 1px dotted #ccc; }
    </style>
</head>
<body>
    <div class="controls">
        <label>背表紙幅(mm): <input type="number" id="spineWidth" value="10" oninput="update()"> </label>
        <button onclick="downloadPNG()">PNGダウンロード</button>
        <button onclick="downloadPDF()">PDFダウンロード</button>
    </div>
    <div class="page" id="captureArea">
        <div class="cut-container">
            <img src="back.png" class="img-item">
            <div class="spine-space" id="spineSpace"></div>
            <img src="front.png" class="img-item">
        </div>
    </div>
    <script>
        function update() { document.getElementById('spineSpace').style.width = document.getElementById('spineWidth').value + 'mm'; }
        
        // PNG保存用
        function downloadPNG() {
            html2canvas(document.getElementById('captureArea')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'layout.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
        
        // PDF保存用
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            html2canvas(document.getElementById('captureArea')).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF('l', 'mm', 'a4');
                pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
                pdf.save("layout.pdf");
            });
        }
    </script>
</body>
</html>
